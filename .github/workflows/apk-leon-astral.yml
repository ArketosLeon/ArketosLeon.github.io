name: APK Leon Astral (teste)

on:
  workflow_dispatch:
  push:
    branches: [build-apk]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: leon-astral-app
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar dependências
        run: |
          npm install --no-audit --no-fund
          npm ls react-native-google-mobile-ads >/dev/null 2>&1 || npm install --no-audit --no-fund react-native-google-mobile-ads@latest
          echo "Versão de anúncios: $(node -p "require('react-native-google-mobile-ads/package.json').version")"
      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install
      - name: Compilar APK
        working-directory: leon-astral-app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk leon-astral-v12-teste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: leon-astral-v12-teste
          path: leon-astral-app/leon-astral-v12-teste.apk
          retention-days: 14

  testar-no-emulador:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leon-astral-v12-teste
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Abrir o app no emulador e capturar o crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r leon-astral-v12-teste.apk || true
            adb logcat -c
            adb shell monkey -p com.arktosleon.leonastral -c android.intent.category.LAUNCHER 1 || true
            sleep 25
            adb logcat -d > logcat.txt || true
            grep -n -A40 "FATAL EXCEPTION\|AndroidRuntime\|ReactNativeJS\|E/libc\|signal 6\|SIGABRT" logcat.txt | head -300 || true
            adb shell pidof com.arktosleon.leonastral && echo "APP_RODANDO" || echo "APP_NAO_ESTA_RODANDO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: logcat.txt
