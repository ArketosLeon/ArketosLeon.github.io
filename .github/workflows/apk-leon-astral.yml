name: APK Leon Astral (teste)

on:
  workflow_dispatch:
  push:
    branches: [build-apk]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: leon-astral-app
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar dependências
        run: |
          npm install --no-audit --no-fund
          npm ls react-native-google-mobile-ads >/dev/null 2>&1 || npm install --no-audit --no-fund react-native-google-mobile-ads@latest
          echo "Versão de anúncios: $(node -p "require('react-native-google-mobile-ads/package.json').version")"
      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install
      - name: Compilar APK
        working-directory: leon-astral-app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk leon-astral-v12-teste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: leon-astral-v12-teste
          path: leon-astral-app/leon-astral-v12-teste.apk
          retention-days: 14
